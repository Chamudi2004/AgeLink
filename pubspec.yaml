name: age_link
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  # Use a valid and stable SDK range
  sdk: '>=3.4.0 <4.0.0'

#
# --- ALL DEPENDENCIES GO HERE ---
#
dependencies:
  flutter:
    sdk: flutter

  # Firebase (Consolidated & Updated Versions)
  firebase_core: ^3.2.0
  firebase_auth: ^5.2.0
  cloud_firestore: ^5.1.0
  firebase_database: ^11.1.0
  firebase_storage: ^12.1.0
  firebase_messaging: ^15.1.0
  google_sign_in: ^6.2.1

  # IoT / Device
  flutter_blue_plus: ^1.35.4
  permission_handler: ^11.3.1

  # Utilities
  intl: ^0.20.2  # <-- This is the critical fix from your error
  image_picker: ^1.1.2
  flutter_secure_storage: ^9.2.4
  pubspec_parse: ^1.5.0 # This is unusual, but I've left it

  # Other
  cupertino_icons: ^1.0.8
  device_preview: ^1.3.1

#
# --- ALL DEV DEPENDENCIES GO HERE ---
#
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.13.1

#
# --- FLUTTER CONFIGURATION ---
#
flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/ai_logo.png # <-- Your logo is included

#
# --- NATIVE SPLASH CONFIGURATION ---
#
flutter_native_splash:
  color: "#F0F4FF"
  color_dark: "#F0F4FF"
  image: assets/logo.png
  image_dark: assets/logo.png
  android_12:
    color: "#F0F4FF"
    image: assets/logo.png

#
# --- LAUNCHER ICONS CONFIGURATION ---
#
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/l_logo.png"
  min_sdk_android: 21